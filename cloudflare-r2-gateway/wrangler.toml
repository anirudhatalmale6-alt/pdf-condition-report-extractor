# ORBAS gated download gateway - Cloudflare Worker + R2
# ------------------------------------------------------
# Fill in the two <PLACEHOLDER> values, then deploy with:  npx wrangler deploy
# The signing secret is set separately (never put it here):
#   npx wrangler secret put DOWNLOAD_SIGNING_KEY

name = "orbas-download-gateway"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# --- Private R2 bucket that holds the installer + manifest.json ---------------
[[r2_buckets]]
binding = "BUCKET"                 # do not change - the Worker code expects "BUCKET"
bucket_name = "<YOUR_R2_BUCKET_NAME>"

# --- Plain (non-secret) config ------------------------------------------------
[vars]
LICENSE_VALIDATE_URL = "https://app.orbas.com.au/api/license/validate"
ALLOWED_ORIGIN = "*"               # tighten to your portal origin in production
LINK_TTL_SECONDS = "300"           # signed download links are valid for 5 minutes

# --- Custom domain ------------------------------------------------------------
# Point the download subdomain at this Worker. The zone must be on your
# Cloudflare account. Example: downloads.orbas.com.au
[[routes]]
pattern = "<YOUR_DOWNLOAD_DOMAIN>"     # e.g. "downloads.orbas.com.au"
custom_domain = true
